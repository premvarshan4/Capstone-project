<!DOCTYPE html>
<html>
<head>
    <title>Village Search</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Village Search 🔍</h1>

    <div class="search-container">
        <input 
            type="text" 
            id="searchBox" 
            placeholder="Enter village name..."
        >
        <button onclick="search()">Search</button>
    </div>

    <div id="results"></div>

    <script>
        async function search() {
            const query = document.getElementById("searchBox").value.trim();

            if (!query) {
                alert("Please enter a village name");
                return;
            }

            try {
                const response = await fetch(`http://127.0.0.1:8000/search?q=${query}`);
                const data = await response.json();

                let output = "";

                if (data.length === 0) {
                    output = "<p class='no-result'>No results found</p>";
                } else {
                    data.forEach(item => {
                        output += `
                        <div class="result-card">
                            <b>${item.village}</b><br>
                            ${item.subdistrict}, ${item.district}, ${item.state}
                        </div>
                        `;
                    });
                }

                document.getElementById("results").innerHTML = output;

            } catch (error) {
                console.error("Error:", error);
                document.getElementById("results").innerHTML =
                    "<p class='no-result'>Error connecting to server</p>";
            }
        }

        // 🔥 Optional: Press Enter to search
        document.getElementById("searchBox").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                search();
            }
        });
    </script>

</body>
</html>
